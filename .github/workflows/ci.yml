name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: swift test (NotchUsageCore)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Run tests
        run: swift test

  app-build:
    name: xcodebuild (NotchUsage.app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: >
          xcodebuild -project NotchUsage.xcodeproj -scheme NotchUsage
          -configuration Debug -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO build
