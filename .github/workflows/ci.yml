name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jeton de CI en lecture seule : aucun job n'écrit dans le dépôt (007).
permissions:
  contents: read

# Machines Intel pour les jobs bloquants : les runners macOS arm64 de GitHub manquent de capacité
# (jobs annulés faute de runner). Un job arm64 non bloquant couvre la cible réelle (tout Mac à encoche).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: swift test (NotchUsageCore)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        # Dernière version stable présente sur l'image : un chemin figé casse à chaque mise à jour.
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e rc | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Run tests
        run: swift test

  app-build:
    name: xcodebuild (NotchUsage.app)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        # Dernière version stable présente sur l'image : un chemin figé casse à chaque mise à jour.
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e rc | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: >
          xcodebuild -project NotchUsage.xcodeproj -scheme NotchUsage
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath .build/DerivedData
          CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO build
      - name: App tests
        run: >
          xcodebuild -project NotchUsage.xcodeproj -scheme NotchUsage
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath .build/DerivedData
          CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO test
      - name: Check translations
        run: scripts/check-localizations.sh .build/DerivedData

  core-tests-arm64:
    name: swift test (arm64, non bloquant)
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e rc | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Run tests
        run: swift test
