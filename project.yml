name: NotchUsage
options:
  bundleIdPrefix: com.notchusage
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

packages:
  NotchUsageCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES

targets:
  NotchUsage:
    type: application
    platform: macOS
    sources:
      - path: App/NotchUsage
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: NotchUsageCore
        product: NotchUsageCore
    info:
      path: App/NotchUsage/Resources/Info.plist
      properties:
        CFBundleName: Notch Usage
        CFBundleDisplayName: Notch Usage
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Florent Maille. MIT License."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: App/NotchUsage/Resources/NotchUsage.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchusage.app
        PRODUCT_NAME: NotchUsage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""

schemes:
  NotchUsage:
    build:
      targets:
        NotchUsage: all
    run:
      config: Debug
    archive:
      config: Release
